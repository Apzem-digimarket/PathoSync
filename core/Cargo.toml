[package]
name = "pathosync-core"
version = "0.2.0"
edition = "2021"
description = "Audio engine for PathoSync: multi-mic capture, clock-drift correction, push-to-talk gating and WAV writing"

[dependencies]
cpal = "0.18"
hound = "3.5"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.13"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mp3lame-encoder = "0.3.0"
