[package]
name = "pathosync"
version = "0.1.1"
edition = "2021"
description = "PathoSync – multi-microphone push-to-talk recorder"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pathosync-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.13"
